# Render Blueprint: one Docker web service plus a Postgres database, in Singapore (closest Render region to India).
services:
  - type: web
    name: peti
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: peti-db
    plan: free
    region: singapore
